name: Generate educational video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема познавательного видео на русском языке"
        required: true
        type: string
        default: "Почему небо голубое?"
      duration_seconds:
        description: "Длительность видео в секундах (короткий тестовый ролик)"
        required: true
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: generate-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libespeak1 fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy pyttsx3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build video compositor
        run: cargo build --release

      - name: Generate video
        env:
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_DURATION: ${{ inputs.duration_seconds }}
        run: |
          python run.py \
            --topic "$VIDEO_TOPIC" \
            --video-backend procedural \
            --no-llm-planning \
            --duration-seconds "$VIDEO_DURATION" \
            --output-dir outputs/generated \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --width 720 \
            --height 1280 \
            --fps 24 \
            --rust-threads 2 \
            --log-level INFO

      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: educational-video-mp4
          path: outputs/generated/*.mp4
          if-no-files-found: error
          retention-days: 7
